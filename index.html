<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>학습 포털</title>
<style>
  :root{
    --bg: oklch(98% 0.005 250);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(96.5% 0.005 250);
    --text: oklch(18% 0.01 250);
    --muted: oklch(48% 0.02 250);
    --border: oklch(90% 0.008 250);
    --accent: oklch(48% 0.18 254);
    --accent-soft: oklch(95% 0.04 254);
    --done: oklch(60% 0.15 145);
    --done-soft: oklch(95% 0.05 145);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.04), 0 4px 12px oklch(0% 0 0 / 0.06);
    --radius: 6px;
    --duration: 200ms;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }
  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; height: 100%; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.55;
  }
  kbd{
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11.5px; padding: 1px 6px; border-radius: 4px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--muted);
  }
  .app{
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas: "topbar topbar" "sidebar main";
    height: 100vh;             /* fallback */
    height: 100dvh;            /* iOS Safari 주소창 포함 정확 */
  }
  .hamburger{
    display: none;             /* 데스크톱은 숨김 */
    border: 1px solid var(--border); background: var(--surface);
    width: 36px; height: 36px; padding: 0;
    border-radius: var(--radius); cursor: pointer;
    align-items: center; justify-content: center;
    font-size: 18px; color: var(--text);
  }
  .hamburger:hover{ background: var(--surface-2); }
  .sidebar-overlay{
    display: none;
    position: fixed; inset: 0;
    background: oklch(0% 0 0 / 0.4);
    z-index: 90;
  }
  .sidebar-overlay.show{ display: block; }
  .topbar{
    grid-area: topbar;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand{
    font-weight: 600; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 8px;
  }
  .brand a{
    color: var(--text); text-decoration: none;
  }
  .modes{ display: flex; gap: 4px; margin-left: 8px; }
  .mode-btn{
    border: 1px solid var(--border); background: var(--surface);
    padding: 6px 12px; border-radius: var(--radius);
    color: var(--text); font-size: 13px; cursor: pointer;
    transition: all var(--duration) var(--ease);
    display: flex; align-items: center; gap: 5px;
  }
  .mode-btn:hover{ background: var(--surface-2); }
  .mode-btn.active{
    background: var(--accent); color: white; border-color: var(--accent);
  }
  .search{ flex: 1; max-width: 360px; margin-left: auto; }
  .search input{
    width: 100%; border: 1px solid var(--border);
    background: var(--surface-2); border-radius: var(--radius);
    padding: 7px 12px; font-size: 13px; color: var(--text);
    transition: border-color var(--duration) var(--ease);
  }
  .search input:focus{
    outline: none; border-color: var(--accent);
    background: var(--surface);
  }
  .controls{ display: flex; align-items: center; gap: 6px; }
  .btn{
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px 10px;
    font-size: 12.5px; color: var(--text); cursor: pointer;
    transition: background var(--duration) var(--ease);
  }
  .btn:hover{ background: var(--surface-2); }

  .sidebar{
    grid-area: sidebar;
    background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .course-picker{
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .course-picker-label{
    font-size: 10.5px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .course-picker select{
    width: 100%;
    border: 1px solid var(--border); background: var(--surface);
    border-radius: var(--radius); padding: 7px 10px;
    font-size: 13px; color: var(--text); cursor: pointer;
    font-family: inherit;
  }
  .course-picker select:focus{
    outline: none; border-color: var(--accent);
  }
  .course-meta{
    margin-top: 8px;
    font-size: 11.5px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .course-meta .tag{
    background: var(--surface); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 999px;
    font-size: 10.5px;
  }
  .course-list{
    flex: 1; overflow-y: auto;
    padding: 14px 10px;
  }
  .cat{ margin-bottom: 18px; }
  .cat-head{
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px 6px; gap: 8px;
  }
  .cat-title{ font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .cat-progress{ font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cat-bar{ height: 2px; background: var(--surface-2); border-radius: 999px; margin: 0 10px 8px; overflow: hidden; }
  .cat-bar > div{ height: 100%; background: var(--done); transition: width var(--duration) var(--ease); }
  .file{
    display: grid; grid-template-columns: 18px 1fr auto;
    align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: var(--radius);
    cursor: pointer; transition: background var(--duration) var(--ease);
    font-size: 13px;
  }
  .file:hover{ background: var(--surface-2); }
  .file.active{ background: var(--accent-soft); color: var(--accent); }
  .file.done .file-title{ color: var(--muted); text-decoration: line-through; }
  .file-check{
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); color: transparent;
    font-size: 11px; font-weight: 600;
    transition: all var(--duration) var(--ease);
  }
  .file.done .file-check{ background: var(--done); color: white; }
  .file-title{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta{ color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

  .main{
    grid-area: main; overflow-y: auto; padding: 24px;
    scroll-behavior: smooth;
  }
  .empty{
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); font-size: 13.5px; line-height: 2;
    text-align: center;
  }
  .doc-header{
    display: flex; align-items: baseline; gap: 14px;
    padding: 4px 24px 16px; max-width: 900px; margin: 0 auto;
    border-bottom: 1px solid var(--border); margin-bottom: 20px;
  }
  .doc-title{ font-size: 18px; font-weight: 600; letter-spacing: -0.01em; flex: 1; }
  .doc-sub{ font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', ui-monospace, monospace; }

  .md-view{
    max-width: 900px; margin: 0 auto; padding: 0 24px;
    line-height: 1.7; color: var(--text); font-size: 14.5px;
  }
  .md-view h1, .md-view h2, .md-view h3, .md-view h4{
    letter-spacing: -0.01em; line-height: 1.3;
    margin: 1.6em 0 0.6em;
  }
  .md-view h1{ font-size: 24px; }
  .md-view h2{ font-size: 19px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .md-view h3{ font-size: 16px; color: var(--accent); }
  .md-view h4{ font-size: 14.5px; }
  .md-view p, .md-view ul, .md-view ol{ margin: 0.6em 0; }
  .md-view ul, .md-view ol{ padding-left: 1.6em; }
  .md-view li{ margin: 0.2em 0; }
  .md-view a{ color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .md-view a:hover{ border-bottom-color: var(--accent); }
  .md-view code{
    background: var(--surface-2); padding: 1px 6px; border-radius: 3px;
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;
    color: oklch(35% 0.15 280);
  }
  .md-view pre{
    background: oklch(15% 0.01 250); color: oklch(92% 0.005 250);
    padding: 16px; border-radius: var(--radius); overflow-x: auto;
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;
    line-height: 1.55; margin: 12px 0;
    position: relative;
  }
  .md-view pre code{ background: transparent; padding: 0; color: inherit; font-size: inherit; }
  .md-view pre code.hljs{ background: transparent; padding: 0; }
  .md-view .copy-btn{
    position: absolute; top: 8px; right: 8px;
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: oklch(25% 0.01 250); color: oklch(70% 0.005 250);
    border: none; cursor: pointer;
    opacity: 0; transition: opacity var(--duration) var(--ease);
  }
  .md-view pre:hover .copy-btn{ opacity: 1; }
  .md-view .copy-btn:hover{ background: oklch(35% 0.01 250); color: white; }
  .md-view blockquote{
    border-left: 3px solid var(--accent);
    padding: 4px 16px; margin: 12px 0; color: var(--muted);
    background: var(--accent-soft);
  }
  .md-view table{
    border-collapse: collapse; margin: 12px 0; width: 100%;
    font-size: 13.5px;
  }
  .md-view th, .md-view td{
    border: 1px solid var(--border); padding: 7px 12px; text-align: left;
  }
  .md-view th{ background: var(--surface-2); font-weight: 600; }
  .md-view details{
    margin: 8px 0; padding: 6px 12px; background: var(--surface-2);
    border-radius: var(--radius); border: 1px solid var(--border);
  }
  .md-view details[open]{ background: var(--surface); }
  .md-view summary{ cursor: pointer; font-weight: 500; color: var(--accent); padding: 4px 0; }
  .md-view details > *:not(summary){ margin-top: 8px; }
  .md-empty{
    padding: 40px 0; text-align: center; color: var(--muted); font-size: 13.5px;
  }
  .home-grid{
    max-width: 900px; margin: 0 auto; padding: 0 24px;
  }
  .home-grid h2{
    font-size: 14px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 24px 0 12px;
  }
  .home-card-list{ display: grid; gap: 10px; }
  .home-card{
    padding: 14px 18px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    cursor: pointer; transition: all var(--duration) var(--ease);
  }
  .home-card:hover{ border-color: var(--accent); background: var(--surface-2); }
  .home-card.empty{
    cursor: default; opacity: 0.5;
  }
  .home-card.empty:hover{ border-color: var(--border); background: var(--surface); }
  .home-card-title{ font-weight: 600; font-size: 15px; }
  .home-card-sub{ font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .home-card-tags{ display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .home-card-tags .tag{
    font-size: 10.5px; padding: 1px 7px;
    background: var(--surface-2); border-radius: 999px; color: var(--muted);
  }
  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: oklch(20% 0.01 250); color: white;
    padding: 10px 20px; border-radius: var(--radius);
    font-size: 13px; pointer-events: none;
    opacity: 0; transition: all var(--duration) var(--ease);
    z-index: 100;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 720px){
    .app{
      grid-template-columns: 1fr;
      grid-template-areas: "topbar" "main";
    }
    /* 사이드바: 슬라이드 패널 */
    .sidebar{
      position: fixed; top: 0; left: 0; bottom: 0;
      width: min(320px, 85vw);
      transform: translateX(-100%);
      transition: transform var(--duration) var(--ease);
      z-index: 100; box-shadow: var(--shadow);
    }
    .sidebar.open{ transform: translateX(0); }

    /* topbar 압축 */
    .topbar{ padding: 0 12px; gap: 8px; }
    .hamburger{ display: inline-flex; }
    .brand{ font-size: 13px; }
    .brand-tag{ display: none; }
    .modes{ margin-left: 0; gap: 2px; }
    .mode-btn{
      padding: 6px 9px; font-size: 13px;
      min-width: 36px; min-height: 36px;     /* 터치 영역 */
    }
    .mode-btn .mode-label{ display: none; }  /* 이모지만 표시 */
    .search{ max-width: none; flex: 1 1 auto; min-width: 0; }
    .search input{ font-size: 16px; }        /* iOS 자동 zoom 방지 */
    .controls .btn{ min-width: 36px; min-height: 36px; }
    .main{ padding: 16px; }
    .doc-header{ padding: 4px 0 12px; }
    .md-view{ padding: 0 4px; font-size: 14px; }
  }
  @media (max-width: 480px){
    .search{ display: none; }                /* 매우 좁은 화면에선 검색 숨김 (사이드바 안에 있음) */
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="hamburger" id="hamburger" aria-label="사이드바 열기">☰</button>
    <div class="brand"><a href="#" id="brand-link">📚 학습 포털</a></div>
    <div class="modes" role="tablist" aria-label="보기 모드" id="modes">
      <button class="mode-btn active" data-mode="study" title="학습 노트 (1)">📖<span class="mode-label"> 학습</span></button>
      <button class="mode-btn"        data-mode="quiz"  title="퀴즈 (2)">🎯<span class="mode-label"> 퀴즈</span></button>
      <button class="mode-btn"        data-mode="cheat" title="치트시트 (3)">📝<span class="mode-label"> 치트</span></button>
      <button class="mode-btn"        data-mode="roadmap" title="로드맵 (4)">🗺<span class="mode-label"> 로드맵</span></button>
    </div>
    <div class="search">
      <input type="search" id="search" placeholder="강의명 검색 (/ 누름)" autocomplete="off" />
    </div>
    <div class="controls">
      <button class="btn" id="help-btn" title="단축키 안내">?</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="course-picker" id="course-picker"></div>
    <div class="course-list" id="course-list"></div>
  </aside>

  <main class="main" id="main">
    <div class="empty" id="empty">불러오는 중...</div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="toast" id="toast"></div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<script>

// ───────── 상태 ─────────
const state = {
  manifest: null,     // 전체 코스 목록
  course: null,       // 현재 선택된 코스 메타 (course.json)
  courseInfo: null,   // manifest 안의 코스 항목 (id, title, path, tags)
  current: null,      // 현재 열린 강의 {stem, label}
  mode: 'study',
};

const LS_COURSE = 'portal.course';     // 현재 코스 id
const LS_MODE   = 'portal.mode';        // 모드
const lsDoneKey = id => `portal.done.${id}`;
const lsOpenKey = id => `portal.open.${id}`;

const getDone = (cid) => {
  try { return new Set(JSON.parse(localStorage.getItem(lsDoneKey(cid)) || '[]')); }
  catch { return new Set(); }
};
const setDone = (cid, s) => localStorage.setItem(lsDoneKey(cid), JSON.stringify([...s]));

// 옛 localStorage 마이그레이션 (study.done -> portal.done.ssafy-java)
function migrateLegacyLs(){
  const legacyDone = localStorage.getItem('study.done');
  if (legacyDone && !localStorage.getItem(lsDoneKey('ssafy-java'))){
    try {
      const arr = JSON.parse(legacyDone)
        .map(n => n.replace(/\.pdf$/, ''));
      localStorage.setItem(lsDoneKey('ssafy-java'), JSON.stringify(arr));
    } catch {}
  }
  const legacyOpen = localStorage.getItem('study.open');
  if (legacyOpen && !localStorage.getItem(lsOpenKey('ssafy-java'))){
    localStorage.setItem(lsOpenKey('ssafy-java'), legacyOpen.replace(/\.pdf$/, ''));
  }
  const legacyMode = localStorage.getItem('study.mode');
  if (legacyMode && !localStorage.getItem(LS_MODE)){
    const m = ['study', 'quiz', 'cheat', 'roadmap'].includes(legacyMode) ? legacyMode : 'study';
    localStorage.setItem(LS_MODE, m);
  }
}

const sidebarEl   = document.getElementById('sidebar');
const pickerEl    = document.getElementById('course-picker');
const courseListEl= document.getElementById('course-list');
const mainEl      = document.getElementById('main');
const emptyEl     = document.getElementById('empty');
const modesEl     = document.getElementById('modes');
const searchEl    = document.getElementById('search');
const helpBtn     = document.getElementById('help-btn');
const brandLink   = document.getElementById('brand-link');
const hamburgerEl = document.getElementById('hamburger');
const overlayEl   = document.getElementById('sidebar-overlay');
const toastEl     = document.getElementById('toast');

const isMobile = () => window.matchMedia('(max-width: 720px)').matches;
function openSidebar(){
  sidebarEl.classList.add('open');
  overlayEl.classList.add('show');
}
function closeSidebar(){
  sidebarEl.classList.remove('open');
  overlayEl.classList.remove('show');
}
hamburgerEl.addEventListener('click', openSidebar);
overlayEl.addEventListener('click', closeSidebar);

function toast(msg, ms = 1500){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
}

// ───────── 코드 블록 데코 ─────────
function decorateMarkdownCode(view){
  view.querySelectorAll('pre').forEach(pre => {
    if (pre.dataset.decorated) return;
    const code = pre.querySelector('code');
    if (!code) return;
    pre.dataset.decorated = '1';
    if (window.hljs){ try { window.hljs.highlightElement(code); } catch {} }
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(code.textContent);
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      } catch { btn.textContent = 'Failed'; }
    });
    pre.appendChild(btn);
  });
}

async function fetchText(path){
  try{
    const res = await fetch(path);
    if (!res.ok) return null;
    return await res.text();
  } catch { return null; }
}
async function fetchJson(path){
  try{
    const res = await fetch(path);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

const stripDate = s => (s || '').replace(/^\d{2}\/\d{2}\s+/, '');

const estCache = new Map();
async function estimateMinutes(path){
  if (estCache.has(path)) return estCache.get(path);
  try{
    const res = await fetch(path);
    if (!res.ok){ estCache.set(path, ''); return ''; }
    const txt = await res.text();
    const size = new Blob([txt]).size;
    if (size === 0){ estCache.set(path, ''); return ''; }
    const rawMin = (size / 1024) * 4;
    const minutes = Math.max(5, Math.round(rawMin / 5) * 5);
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    const result = '~ ' + (h ? `${h}h${m ? ` ${m}m` : ''}` : `${m}m`);
    estCache.set(path, result);
    return result;
  } catch { return ''; }
}

// ───────── 코스 선택기 ─────────
function renderCoursePicker(){
  pickerEl.innerHTML = '';
  const all = state.manifest.categories.flatMap(c => c.courses.map(co => ({...co, catTitle: c.title})));
  if (all.length === 0){
    pickerEl.style.display = 'none';
    return;
  }

  const labelEl = document.createElement('div');
  labelEl.className = 'course-picker-label';
  labelEl.textContent = '코스 선택';
  pickerEl.appendChild(labelEl);

  const sel = document.createElement('select');
  for (const cat of state.manifest.categories){
    if (cat.courses.length === 0) continue;
    const og = document.createElement('optgroup');
    og.label = cat.title;
    for (const co of cat.courses){
      const opt = document.createElement('option');
      opt.value = co.id;
      opt.textContent = co.title;
      if (state.courseInfo?.id === co.id) opt.selected = true;
      og.appendChild(opt);
    }
    sel.appendChild(og);
  }
  sel.addEventListener('change', () => switchCourse(sel.value));
  pickerEl.appendChild(sel);

  if (state.course){
    const meta = document.createElement('div');
    meta.className = 'course-meta';
    (state.course.tags || []).forEach(t => {
      const span = document.createElement('span');
      span.className = 'tag';
      span.textContent = t;
      meta.appendChild(span);
    });
    pickerEl.appendChild(meta);
  }
}

// ───────── 사이드바 ─────────
function renderSidebar(filter = ''){
  courseListEl.innerHTML = '';
  if (!state.course) return;
  const done = getDone(state.courseInfo.id);

  for (const sec of state.course.sections){
    const visible = filter
      ? sec.items.filter(it => (it.stem + ' ' + it.label).toLowerCase().includes(filter.toLowerCase()))
      : sec.items;
    if (visible.length === 0) continue;
    const total = sec.items.length;
    const doneCount = sec.items.filter(it => done.has(it.stem)).length;
    const catEl = document.createElement('div');
    catEl.className = 'cat';
    catEl.innerHTML = `
      <div class="cat-head">
        <div class="cat-title">${sec.title}</div>
        <div class="cat-progress">${doneCount}/${total}</div>
      </div>
      <div class="cat-bar"><div style="width:${total ? (doneCount/total)*100 : 0}%"></div></div>
    `;
    for (const it of visible){
      const fileEl = document.createElement('div');
      fileEl.className = 'file' + (done.has(it.stem) ? ' done' : '') + (state.current?.stem === it.stem ? ' active' : '');
      fileEl.innerHTML = `
        <div class="file-check" title="공부 완료 체크">${done.has(it.stem) ? '✓' : ''}</div>
        <div class="file-title">${sec.items.indexOf(it) + 1}. ${stripDate(it.label)}</div>
        <div class="file-meta"></div>
      `;
      estimateMinutes(`${state.courseInfo.path}/STUDY/${encodeURIComponent(it.stem)}.md`)
        .then(t => { const m = fileEl.querySelector('.file-meta'); if (m) m.textContent = t; });
      fileEl.querySelector('.file-check').addEventListener('click', (e) => {
        e.stopPropagation();
        const s = getDone(state.courseInfo.id);
        if (s.has(it.stem)) s.delete(it.stem); else s.add(it.stem);
        setDone(state.courseInfo.id, s);
        renderSidebar(filter);
      });
      fileEl.addEventListener('click', () => openFile(it.stem, it.label));
      catEl.appendChild(fileEl);
    }
    courseListEl.appendChild(catEl);
  }
}

// ───────── 코스 전환 ─────────
async function switchCourse(courseId){
  const all = state.manifest.categories.flatMap(c => c.courses);
  const info = all.find(c => c.id === courseId);
  if (!info){ toast('코스 없음: ' + courseId); return; }
  state.courseInfo = info;
  localStorage.setItem(LS_COURSE, courseId);

  state.course = await fetchJson(`${info.path}/course.json`);
  if (!state.course){
    mainEl.innerHTML = `<div class="md-empty">코스 메타 (${info.path}/course.json) 로드 실패</div>`;
    return;
  }
  // 코스별 마지막 열린 강의 복원
  const lastOpen = localStorage.getItem(lsOpenKey(courseId));
  if (lastOpen){
    const flat = state.course.sections.flatMap(s => s.items);
    const found = flat.find(it => it.stem === lastOpen);
    state.current = found ? { stem: found.stem, label: found.label } : null;
  } else {
    state.current = null;
  }
  renderCoursePicker();
  renderSidebar();
  setMode(state.mode || 'study');
}

// ───────── 모드 전환 ─────────
function setMode(mode){
  state.mode = mode;
  localStorage.setItem(LS_MODE, mode);
  modesEl.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });

  if (mode === 'roadmap'){
    renderRoadmap();
    return;
  }
  if (!state.current){
    mainEl.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'md-empty';
    div.textContent = '왼쪽에서 강의를 선택하면 이 모드에서 볼 수 있습니다.';
    mainEl.appendChild(div);
    return;
  }
  if (mode === 'study') return renderStudy();
  if (mode === 'quiz')  return renderQuiz();
  if (mode === 'cheat') return renderCheat();
}

modesEl.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    setMode(btn.dataset.mode);
    if (isMobile()) closeSidebar();
  });
});

// ───────── 강의 선택 ─────────
function openFile(stem, label){
  localStorage.setItem(lsOpenKey(state.courseInfo.id), stem);
  state.current = { stem, label: label || stem };
  renderSidebar(searchEl.value.trim());
  setMode(state.mode === 'roadmap' ? 'study' : state.mode);
  if (isMobile()) closeSidebar();
}

// ───────── 컨텐츠 렌더 ─────────
async function renderMd(mode, subdir, label, emptyMsg){
  mainEl.innerHTML = '';
  const { stem, label: courseLabel } = state.current;
  const path = `${state.courseInfo.path}/${subdir}/${encodeURIComponent(stem)}.md`;
  const header = document.createElement('div');
  header.className = 'doc-header';
  header.innerHTML = `<div class="doc-title">${label} ${stripDate(courseLabel)}</div>`;
  mainEl.appendChild(header);

  const view = document.createElement('div');
  view.className = 'md-view';
  mainEl.appendChild(view);

  const md = await fetchText(path);
  if (!md){
    view.innerHTML = `<div class="md-empty">${emptyMsg}</div>`;
    return;
  }
  view.innerHTML = window.marked.parse(md);
  decorateMarkdownCode(view);
}

const renderStudy = () => renderMd('study', 'STUDY', '📖', '학습 노트가 아직 없음.');
const renderQuiz  = () => renderMd('quiz',  'QUIZ',  '🎯', '퀴즈가 아직 없음.');
const renderCheat = () => renderMd('cheat', 'CHEATSHEETS', '📝', '치트시트가 아직 없음.');

async function renderRoadmap(){
  mainEl.innerHTML = '';
  if (!state.course){
    mainEl.appendChild(emptyEl);
    return;
  }
  const view = document.createElement('div');
  view.className = 'md-view';
  mainEl.appendChild(view);
  const md = await fetchText(`${state.courseInfo.path}/ROADMAP.md`);
  if (!md){
    view.innerHTML = '<div class="md-empty">ROADMAP.md 없음.</div>';
    return;
  }
  view.innerHTML = window.marked.parse(md);
  decorateMarkdownCode(view);
  // 로드맵 표의 강의 stem 셀 클릭 → 그 강의 열기
  const stems = new Map();
  for (const sec of state.course.sections){
    for (const it of sec.items){
      stems.set(it.stem, it.label);
    }
  }
  view.querySelectorAll('td').forEach(td => {
    const text = td.textContent.trim();
    if (stems.has(text)){
      td.style.cursor = 'pointer';
      td.style.color = 'var(--accent)';
      td.style.fontWeight = '500';
      td.title = '클릭하면 학습 노트 열기';
      td.addEventListener('click', () => {
        openFile(text, stems.get(text));
        setMode('study');
      });
    }
  });
}

// ───────── 홈 (코스 미선택 시) ─────────
function renderHome(){
  mainEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'home-grid';
  wrap.innerHTML = `
    <div style="text-align:center;padding:40px 0 20px">
      <div style="font-size:32px;font-weight:600;letter-spacing:-0.02em">${state.manifest.title}</div>
      <div style="color:var(--muted);margin-top:6px">${state.manifest.description || ''}</div>
    </div>
  `;

  for (const cat of state.manifest.categories){
    const h = document.createElement('h2');
    h.textContent = cat.title;
    wrap.appendChild(h);

    const list = document.createElement('div');
    list.className = 'home-card-list';

    if (cat.courses.length === 0){
      const empty = document.createElement('div');
      empty.className = 'home-card empty';
      empty.innerHTML = `<div class="home-card-sub">(아직 자료 없음)</div>`;
      list.appendChild(empty);
    } else {
      for (const co of cat.courses){
        const card = document.createElement('div');
        card.className = 'home-card';
        const tags = (co.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
        card.innerHTML = `
          <div class="home-card-title">${co.title}</div>
          ${co.subtitle ? `<div class="home-card-sub">${co.subtitle}</div>` : ''}
          ${tags ? `<div class="home-card-tags">${tags}</div>` : ''}
        `;
        card.addEventListener('click', () => switchCourse(co.id));
        list.appendChild(card);
      }
    }
    wrap.appendChild(list);
  }

  mainEl.appendChild(wrap);
}

// ───────── 검색 ─────────
function search(q){
  q = q.trim();
  if (!q){
    renderSidebar('');
    if (state.current) setMode(state.mode);
    else if (state.course) setMode(state.mode);
    return;
  }
  renderSidebar(q);
}
let searchTimer;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => search(searchEl.value), 200);
});

// ───────── 키보드 ─────────
document.addEventListener('keydown', (e) => {
  if (e.target === searchEl){
    if (e.key === 'Escape'){ searchEl.value = ''; search(''); searchEl.blur(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && sidebarEl.classList.contains('open')){ closeSidebar(); return; }
  if (e.key === '/'){ e.preventDefault(); searchEl.focus(); return; }
  if (e.key === '1'){ setMode('study'); return; }
  if (e.key === '2'){ setMode('quiz'); return; }
  if (e.key === '3'){ setMode('cheat'); return; }
  if (e.key === '4'){ setMode('roadmap'); return; }
  if (e.key === '?'){ showHelp(); return; }
});
function showHelp(){
  toast('단축키 · /=검색 · 1=학습 2=퀴즈 3=치트 4=로드맵', 3500);
}
helpBtn.addEventListener('click', showHelp);
brandLink.addEventListener('click', (e) => {
  e.preventDefault();
  state.current = null;
  state.course = null;
  state.courseInfo = null;
  localStorage.removeItem(LS_COURSE);
  renderCoursePicker();
  renderSidebar();
  renderHome();
});

// ───────── 초기화 ─────────
async function init(){
  migrateLegacyLs();

  state.manifest = await fetchJson('manifest.json');
  if (!state.manifest){
    mainEl.innerHTML = '<div class="md-empty">manifest.json 로드 실패</div>';
    return;
  }

  const savedMode = localStorage.getItem(LS_MODE);
  if (['study', 'quiz', 'cheat', 'roadmap'].includes(savedMode)){
    state.mode = savedMode;
  }

  const savedCourse = localStorage.getItem(LS_COURSE);
  const all = state.manifest.categories.flatMap(c => c.courses);
  if (savedCourse && all.some(c => c.id === savedCourse)){
    await switchCourse(savedCourse);
  } else if (all.length === 1){
    // 코스가 1개면 자동 진입
    await switchCourse(all[0].id);
  } else {
    renderCoursePicker();
    renderHome();
  }
}

init();
</script>
